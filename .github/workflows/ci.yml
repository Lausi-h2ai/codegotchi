name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    rust:
        name: Rust checks
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Install stable Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  components: rustfmt, clippy

            - name: Check Rust formatting
              run: cargo fmt --all -- --check

            - name: Run Rust clippy
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings

            - name: Run Rust workspace tests
              run: cargo test --workspace

    web:
        name: Web checks
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Install Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Activate Corepack
              run: corepack enable

            - name: Verify pinned pnpm
              run: test "$(corepack pnpm --version)" = "11.20.0"

            - name: Install web dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Run workspace tests
              run: corepack pnpm test

            - name: Run workspace lint
              run: corepack pnpm lint

            - name: Check workspace formatting
              run: corepack pnpm format:check

            - name: Build workspace
              run: corepack pnpm build

            - name: Embed the production web bundle
              run: node web/scripts/embed-web.mjs

            - name: Install the pinned Playwright Chromium
              run: corepack pnpm --filter @codegotchi/web exec playwright install --with-deps chromium

            - name: Run the production Playwright flow
              run: corepack pnpm playwright:test:production
